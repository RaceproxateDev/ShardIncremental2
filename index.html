<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>an incremental about unlocking content rewritten</title>
    </head>
    <body>
        <h2 id="ShardsTxt" style="text-align: center;">Shards: 0 [+1/s]</h2>
        <h3 style="text-align: center; color: gray; font-style: italic; font-weight: 500;" id="UnlockNextTxt">Get 1,000 Shards [0%]</h3>

        <section style="overflow-x: auto;">
            <button id="SettingsTab" class="tabs" onclick="ShowHideDivs('Settings')">Settings</button>
            <button id="ShardUpgradesTab" class="tabs" onclick="ShowHideDivs('ShardUpgradesContent')">Shard Upgrades</button>
            <button id="ConstructionResetTab" class="tabs" onclick="ShowHideDivs('ConstructionResetContent')" style="display: none;">Construction</button>
        </section>
        
        <div class="content" id="Settings" style="display: none;">
            <h3 style="text-align: center;">Settings</h3>
            <h3>[Data]</h3>
            <button class="SettingsButtons" style="background-color: black; border: 2px solid blue; color: blue;" onclick="exportData()">Export Save</button>
            <button class="SettingsButtons" style="background-color: black; border: 2px solid lightblue; color: lightblue;" onclick="ImportData()">Import Save</button>
            <button class="SettingsButtons" style="background-color: black; border: 2px solid red; color: red;" onclick="resetData()">Hard Reset</button><br>

            <h3>[Automation]</h3>
        </div>

        <div class="content" id="ShardUpgradesContent" style="display: none;">
            <h3 style="text-align: center;">Shard Upgrades</h3>

            <button class="UpgradesButtons" onclick="ShowHideUpgradeSections('MoreShardsISection')">More Shards I</button>
            <button class="UpgradesButtons" onclick="ShowHideUpgradeSections('MoreShardsIISection')">More Shards II</button>

            <br><br>
            <section class="UpgradeSection" id="MoreShardsISection" style="display: none;">
                <h3 id="BuyableMoreShardsILvlTxt">More Shards I [0/999]</h3>
                <p>+100% shards</p>
                <button class="UpgradePurchaseButton" id="MoreShardsIPurchaseButton" onclick="buyUpg(1, 'shards', true)">10 Shards</button><br><br>
            </section>

            <section class="UpgradeSection" id="MoreShardsIISection" style="display: none;">
                <h3 id="BuyableMoreShardsIILvlTxt">More Shards II [0/100]</h3>
                <p>Doubles your shard gain</p>
                <button class="UpgradePurchaseButton" id="MoreShardsIIPurchaseButton" onclick="buyUpg(2, 'shards', true)">100 Shards</button><br><br>
            </section>
        </div>

        <div class="content" id="ConstructionResetContent" style="display: none;">
            <h3 style="text-align: center;">Construction</h3>
            <section style="text-align: center;">
                <button class="subtabs" id="ConstructionResetSubtab" onclick="ShowHideSubDivs('ConstructionResetLayer')">Reset</button>
            </section>

            <div class="subcontent" id="ConstructionResetLayer" style="display: none; text-align: center;">
               <h2>Construct</h2>
               <p>It resets shards and shard upgrades</p>
               <h3 id="CalcConstructionGainTxt">You will gain 0 Construction Points after resetting</h3>
               <button class="ResetlayerButton">Construct</button>
            </div>
        </div>
    </body>

    <link rel="stylesheet" href="Styles/mainGame.css">

    <script src="utils/OmegaNum.js"></script>
    <script src="utils/NumberFormatter.js"></script>
    <script src="save.js"></script>
    <script src="utils/Manager.js"></script>
    <script src="GameScripts/shards.js"></script>
    <script src="GameScripts/UnlockNext.js"></script>
    <script src="utils/UnlockContent.js"></script>
    <script src="GameScripts/construction.js"></script>
</html>
